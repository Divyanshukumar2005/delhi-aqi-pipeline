name: Collect Delhi AQI data

on:
  schedule:
    # GitHub cron runs in UTC. 02:30 UTC = 08:00 IST (UTC+5:30).
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Pull ~90 days of history before the daily collection"
        type: boolean
        default: false

permissions:
  contents: write   # needed to commit the updated database back to the repo

# Never let two runs push at the same time.
concurrency:
  group: collect-aqi
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Backfill history (only when requested)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill }}
        run: python src/backfill.py

      - name: Collect the last 48 hours
        # Exits with code 1 (red cross) if neither OpenAQ nor Open-Meteo returned data.
        run: python src/collect.py

      - name: Commit and push the data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aqi.db data/stations.json 2>/dev/null || git add data/aqi.db
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: update AQI readings $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
